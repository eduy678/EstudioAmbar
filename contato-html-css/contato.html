<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./contato.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato</title>
</head>

<body>

  <header>
    <nav id="nav">
      <p>Estúdio Âmbar</p>

      <button type="button" class="hamburguer" id="btn-menu" aria-label="Abrir menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul>
        <li id="menu">
          <a id="cor" href="../portifolio-html-css/portifolio.html">Portifólio</a>
          <ul id="submenu">
            <li><a href="../retratos-html-css/retratos.html">Retratos</a></li>
            <li><a href="../lugares-html-css/lugares.html">Lugares</a></li>
            <li><a href="../fashion-html-css/fashion.html">Fashion</a></li>
          </ul>
        </li>
      </ul>
      <a href="../sobre-html-css/sobre.html">Sobre</a>
      <a href="../contato-html-css/contato.html">Contato</a>

    </nav>
  </header>

  <section class="contato">

    <!-- Esquerda -->
    <div class="info">
      <h1>Contato</h1>
      <p>Estúdio Âmbar é Feito<br>por Luiz Eduardo</p>
      <p>
        Email: <a href="mailto:info@meusite.com">info@meusite.com</a><br>
        Phone: <a href="tel:+551134567890">(11) 3456-7890</a>
      </p>
    </div>

    <!-- Direita -->
    <form class="formulario">
      <div class="campo">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" required>
      </div>

      <div class="campo">
        <label for="sobrenome">Sobrenome *</label>
        <input type="text" id="sobrenome" name="sobrenome" required>
      </div>

      <div class="campo">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone">
      </div>

      <div class="campo completo">
        <label for="mensagem">Insira sua mensagem aqui</label>
        <textarea id="mensagem" name="mensagem" rows="5"></textarea>
      </div>

      <div class="completo botao-area">
        <button type="submit">Enviar</button>
      </div>
    </form>

  </section>

  </section>

  <script>
    const nav = document.getElementById('nav');
    const btn = document.getElementById('btn-menu');
    const menu = document.getElementById('menu');
    const cor = document.getElementById('cor');

    btn.addEventListener('click', () => {
      const aberto = nav.classList.toggle('aberto');
      btn.classList.toggle('ativo', aberto);
      btn.setAttribute('aria-expanded', aberto);
    });

    cor.addEventListener('click', (e) => {
      if (window.innerWidth <= 1024) {
        e.preventDefault();
        menu.classList.toggle('aberto');
      }
    });
  </script>
</body>

</body>

</html>
